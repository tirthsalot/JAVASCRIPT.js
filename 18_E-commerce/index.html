<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeMart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="#">LuxeMart</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a href="#" class="nav-link active">Home</a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="showModal()">
                            Cart
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


    <div class="container mt-5 bg-dark p-4 rounded">

        <div class="row" id="product-list"></div>

    </div>


    <div class="modal fade" id="cartList">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5>Shopping Cart</h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                 <table class="table table-bordered text-center align-middle">

    <thead>

        <tr>

            <th>ID</th>

            <th>Image</th>

            <th>Name</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Total</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody id="cartTable"></tbody>

</table>

<div class="text-end mt-3 justify-content-end">

    <h3>

        Grand Total :
        <span id="grandTotal">₹0.00</span>

    </h3>

</div>

<div class="text-end">

    <button
    class="btn btn-success"
    onclick="checkOut()">

    Checkout

    </button>

</div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
